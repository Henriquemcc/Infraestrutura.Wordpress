apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: wordpress-configmap-env
    envs:
      - wordpress.env
  - name: wordpress-db-configmap-env
    envs:
      - mysql.env

resources:
  - svc-wordpress-loadbalancer.yaml
  - wordpress-deployment.yaml
  - wordpress-hpa.yaml
  - db-statefulset.yaml
  - db-pvc.yaml
  - db-pv.yaml
  - svc-db.yaml
